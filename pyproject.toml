[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgtt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.scripts]
imgtt = "imgtt.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imgtt"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-mock>=3.0"]

[tool.uv]
tool-bin-dir = "~/.bin"
